<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
<div class="container my-5">
    <h1 class="text-center text-dark">{{ form_title }}</h1>
    <form method="post" class="mt-5 shadow p-4 rounded bg-light">
        <div class="mb-4">
            <label for="isbn" class="form-label">ISBN</label>
            <input type="text" name="isbn" id="isbn" class="form-control shadow-sm" value="{{ form_data.isbn }}" required>
        </div>
        <div class="mb-4">
            <label for="judul" class="form-label">Judul</label>
            <input type="text" name="judul" id="judul" class="form-control shadow-sm" value="{{ form_data.judul }}" required>
        </div>
        <div class="mb-4">
            <label for="pengarang" class="form-label">Pengarang</label>
            <input type="text" name="pengarang" id="pengarang" class="form-control shadow-sm" value="{{ form_data.pengarang }}" required>
        </div>
        <div class="mb-4">
            <label for="kategori" class="form-label">Kategori</label>
            <select name="kategori" id="kategori" class="form-select shadow-sm" required>
                <option value="fiksi" {% if form_data.kategori == 'fiksi' %}selected{% endif %}>Fiksi</option>
                <option value="non-fiksi" {% if form_data.kategori == 'non-fiksi' %}selected{% endif %}>Non-Fiksi</option>
            </select>
        </div>
        <div class="mb-4">
            <label for="halaman" class="form-label">Halaman</label>
            <input type="number" name="halaman" id="halaman" class="form-control shadow-sm" value="{{ form_data.halaman }}" required>
        </div>
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary px-4">{{ submit_label }}</button>
            <a href="list.php" class="btn btn-secondary px-4">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
