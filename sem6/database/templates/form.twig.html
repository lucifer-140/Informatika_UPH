<html>
<head>
    <title>{{ taskDetails.id ? 'Edit Task' : 'New Task' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light text-dark">
<div class="container my-5 p-4 bg-white shadow rounded">
    <h1 class="fs-4 fw-bold mb-4">
        {{ taskDetails.id ? 'Edit Task' : 'New Task' }}
    </h1>

    <form method="post" action="{{ taskDetails.id ? 'edit.php' : 'store.php' }}">
        {% if taskDetails.id %}
        <input type="hidden" name="edit_id" value="{{ taskDetails.id }}">
        {% endif %}
        <div class="mb-3">
            <label for="task" class="form-label">Task:</label>
            <input type="text" id="task" name="task" value="{{ taskDetails.task }}"
                   class="form-control"
                   required>
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Status:</label>
            <select id="status" name="status" class="form-select" required>
                <option value="todo" {% if taskDetails.status == 'todo' %}selected{% endif %}>To do</option>
                <option value="inProgress" {% if taskDetails.status == 'inProgress' %}selected{% endif %}>In Progress</option>
                <option value="done" {% if taskDetails.status == 'done' %}selected{% endif %}>Done</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">
            {{ taskDetails.id ? 'Update Task' : 'Add Task' }}
        </button>
    </form>

    <div class="mt-3">
        <form action="list.php" method="get">
            <button type="submit" class="btn btn-primary">
                Back to List
            </button>
        </form>
    </div>
</div>
</body>
</html>
