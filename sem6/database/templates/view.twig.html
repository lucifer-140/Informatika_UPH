<html>
<head>
    <title>View Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="container mx-auto my-8 p-6 bg-white shadow-md rounded">
    <h1 class="text-2xl font-bold mb-6">View Task</h1>

    <div class="grid grid-cols-2 gap-4">
        <div class="text-gray-600 font-medium">ID:</div>
        <div class="text-gray-900">{{ todo.id }}</div>

        <div class="text-gray-600 font-medium">Task:</div>
        <div class="text-gray-900">{{ todo.task }}</div>

        <div class="text-gray-600 font-medium">Status:</div>
        <div class="text-gray-900">{{ todo.status }}</div>

        <div class="text-gray-600 font-medium">Created At:</div>
        <div class="text-gray-900">{{ todo.created_at }}</div>

        <div class="text-gray-600 font-medium">Updated At:</div>
        <div class="text-gray-900">{{ todo.updated_at }}</div>
    </div>

    <div class="flex space-x-4 mt-6">
        <form action="list.php" method="get">
            <button type="submit"
                    class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                Back to List
            </button>
        </form>

        <form method="post" action="delete.php" onsubmit="return confirm('Are you sure you want to delete this item?')">
            <input type="hidden" name="id" value="{{ todo.id }}">
            <button type="submit"
                    class="bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600">
                Delete
            </button>
        </form>
    </div>
</div>
</body>
</html>
