<html>
<head>
    <title>View Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light text-dark">
<div class="container my-5 p-4 bg-white shadow rounded">
    <h1 class="fs-4 fw-bold mb-3">View Task</h1>

    <div class="row mb-2">
        <div class="col-sm-3 text-secondary">ID:</div>
        <div class="col-sm-9">{{ todo.id }}</div>
    </div>
    <div class="row mb-2">
        <div class="col-sm-3 text-secondary">Task:</div>
        <div class="col-sm-9">{{ todo.task }}</div>
    </div>
    <div class="row mb-2">
        <div class="col-sm-3 text-secondary">Status:</div>
        <div class="col-sm-9">{{ todo.status }}</div>
    </div>
    <div class="row mb-2">
        <div class="col-sm-3 text-secondary">Created At:</div>
        <div class="col-sm-9">{{ todo.created_at }}</div>
    </div>
    <div class="row mb-2">
        <div class="col-sm-3 text-secondary">Updated At:</div>
        <div class="col-sm-9">{{ todo.updated_at }}</div>
    </div>

    <div class="mt-4">
        <a href="list.php" class="btn btn-primary">Back to List</a>
        <form method="post" action="delete.php" class="d-inline" onsubmit="return confirm('Are you sure?')">
            <input type="hidden" name="id" value="{{ todo.id }}">
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
    </div>
</div>
</body>
</html>
