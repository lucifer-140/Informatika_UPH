<html>
<head>
    <title>Task List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="container mx-auto my-8 p-6 bg-white shadow-md rounded">
    <h1 class="text-3xl font-bold mb-6">Task List</h1>

    <div>
        <a href="form.php" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
            Add New Task
        </a>
    </div>

    <table class="w-full mt-6 border-collapse border border-gray-300">
        <thead>
        <tr class="bg-gray-200">
            <th class="border border-gray-300 p-2 text-left">Id</th>
            <th class="border border-gray-300 p-2 text-left">Task</th>
            <th class="border border-gray-300 p-2 text-left">Status</th>
            <th class="border border-gray-300 p-2 text-left">Created At</th>
            <th class="border border-gray-300 p-2 text-left">Updated At</th>
            <th class="border border-gray-300 p-2 text-left">Actions</th>
        </tr>
        </thead>
        <tbody>
        {% for row in rows %}
        <tr class="bg-white hover:bg-gray-50">
            <td class="border border-gray-300 p-2">{{ row.id }}</td>
            <td class="border border-gray-300 p-2">{{ row.task }}</td>
            <td class="border border-gray-300 p-2">{{ row.status }}</td>
            <td class="border border-gray-300 p-2">{{ row.created_at }}</td>
            <td class="border border-gray-300 p-2">{{ row.updated_at }}</td>
            <td class="border border-gray-300 p-2 space-x-2">
                <form method="get" action="form.php" class="inline">
                    <input type="hidden" name="id" value="{{ row.id }}">
                    <button type="submit" class="bg-green-500 text-white py-2 px-3 rounded hover:bg-green-600">
                        Edit
                    </button>
                </form>

                <form method="get" action="view.php" class="inline">
                    <input type="hidden" name="id" value="{{ row.id }}">
                    <button type="submit" class="bg-blue-500 text-white py-2 px-3 rounded hover:bg-blue-600">
                        View
                    </button>
                </form>

                <form method="post" action="delete.php" class="inline" onsubmit="return confirm('Are you sure you want to delete this item?')">
                    <input type="hidden" name="id" value="{{ row.id }}">
                    <button type="submit" class="bg-red-500 text-white py-2 px-3 rounded hover:bg-red-600">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

    <p class="mt-4 text-gray-600">{{ rows_count }} row(s)</p>
</div>
</body>
</html>
